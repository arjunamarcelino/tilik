# Tilik local development infrastructure.
#
# Brings up PostgreSQL + MinIO for local dev. App services (web / api / detector / caddy) are NOT
# here — run those from the terminal in dev; they are filled in for production in Prompt 14.
#
# Bring-up:  cp .env.example ../.env   (edit it)   then (from this dir):
#   docker compose --env-file ../.env up -d postgres minio minio-init
# --env-file ../.env is required: Compose interpolates ${VAR} from .env in its own directory, but the
# single source of truth is the repo-root .env (see ../README.md).

name: tilik

services:
  postgres:
    image: postgres:16.15-alpine3.24
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: tilik
      APP_DB_PASSWORD: ${APP_DB_PASSWORD} # consumed by postgres/init/01-app-role.sh
    ports:
      - '5432:5432'
    volumes:
      - tilik-pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro # runs once, on first init of an empty volume
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio:
    # NOTE: verify this tag still pulls — MinIO reportedly stopped publishing official images to
    # Docker Hub/quay in 2026 (verified: `docker pull minio/minio` → repository does not exist). This
    # uses the Chainguard mirror, which runs as non-root uid 65532 and bundles both `minio` and `mc`.
    # Free tier offers only `:latest`; pin a digest or a dated tag if you have a Chainguard subscription.
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # web console
    volumes:
      - tilik-minio-data:/data
    # No healthcheck: readiness is gated by the minio-init sidecar (`mc ready`). minio shows "Up".

  # One-shot: waits for MinIO to be ready, then creates the default bucket. Exits 0 when done —
  # that Exited(0) is the readiness + bucket-created signal (minio itself never reports "healthy").
  # Reuses the minio image (it ships `sh` + `mc`); MC_CONFIG_DIR points at a writable dir for uid 65532.
  minio-init:
    image: cgr.dev/chainguard/minio:latest
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_BUCKET: ${MINIO_BUCKET}
      MC_CONFIG_DIR: /tmp/.mc
      # Define the alias via env (no eager probe, unlike `mc alias set`); `mc ready` then polls until
      # MinIO is actually serving — this avoids the startup race where mc connects before minio binds.
      MC_HOST_local: http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@minio:9000
    entrypoint:
      - sh
      - -c
      - >
        mc ready local &&
        mc mb --ignore-existing local/"$${MINIO_BUCKET}" &&
        echo "bucket ready: $${MINIO_BUCKET}"
    restart: 'no'

  # --- Filled in for PROD in Prompt 14; local dev runs these from the terminal. ---
  # web:       # TODO(Prompt 14): Next.js reviewer portal — behind Caddy; minimal NEXT_PUBLIC_* env only.
  # api:       # TODO(Prompt 14): NestJS API — depends_on postgres (healthy) + minio; connects as tilik_app.
  # detector:  # TODO(Prompt 14): Python detector worker — polls the outbox; connects as tilik_app.
  # caddy:     # TODO(Prompt 14): reverse proxy, mounts ./Caddyfile, terminates TLS.

volumes:
  tilik-pgdata:
  tilik-minio-data:
